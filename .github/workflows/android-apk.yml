name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - 'apps/mobile/**'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Build standalone APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Sign APK for installation
        run: |
          apk="$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          test -n "$apk"
          key="${RUNNER_TEMP}/taskflow-preview.keystore"
          keytool -genkeypair -v -storetype PKCS12 -keystore "$key" \
            -alias taskflow -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Taskflow Preview,O=Taskflow,C=US"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if "$build_tools/apksigner" verify "$apk" >/dev/null 2>&1; then
            cp "$apk" apps/mobile/taskflow.apk
          else
            "$build_tools/zipalign" -f -v 4 "$apk" "${RUNNER_TEMP}/taskflow-aligned.apk"
            "$build_tools/apksigner" sign --ks "$key" --ks-key-alias taskflow \
              --ks-pass pass:android --key-pass pass:android \
              --out apps/mobile/taskflow.apk "${RUNNER_TEMP}/taskflow-aligned.apk"
          fi
          "$build_tools/apksigner" verify apps/mobile/taskflow.apk

      - name: Publish public APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v${{ github.run_number }}"
          gh release create "$tag" \
            apps/mobile/taskflow.apk \
            --title "Taskflow Android APK" \
            --notes "Standalone installable Android preview build with the JavaScript bundle included. Signed with a preview key; not a Google Play release."
