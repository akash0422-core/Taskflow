name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Build installable APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug

      - name: Publish public APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v${{ github.run_number }}"
          gh release create "$tag" \
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Taskflow Android APK" \
            --notes "Installable Android preview build. This APK is debug-signed and is not a Google Play release."
