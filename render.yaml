services:
  - type: web
    name: taskflow-fullstack
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run db:generate --workspace @taskflow/api && npm run build --workspace @taskflow/web
    preDeployCommand: npm run db:deploy --workspace @taskflow/api
    startCommand: npm run start --workspace @taskflow/api
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db-demo
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: HOST
        value: 0.0.0.0
      - key: WEB_ORIGIN
        value: https://taskflow-fullstack.onrender.com

databases:
  - name: taskflow-db-demo
    plan: free
    region: singapore
    postgresMajorVersion: "16"
